<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
  #default-bg{display:block;width:100%;height:100%;object-fit:cover}
  /* Darkening veil over the art: opacity comes from the day's `tint` (0-100). */
  #default-bg-tint{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;pointer-events:none}
</style>
</head>
<body>
<script src="js/theme-state.js?v=15"></script>
<script>
// Host page for the default background. data/bg-default.json names a full-bleed image, an accent
// colour and a darkening `tint` for each day of the year, 1-365, plus a `default` fallback.
(function () {
  'use strict';

  function show(resolved) {
    if (!resolved || !resolved.image) return;
    var img = document.createElement('img');
    img.id = 'default-bg';
    img.alt = '';
    img.decoding = 'async';
    // Missing art just leaves the plain black page rather than a broken image icon.
    img.addEventListener('error', function () { img.remove(); });
    img.src = resolved.image;
    document.body.appendChild(img);

    // Veil the art by the day's tint: 0 is invisible, 100 is solid black. Kept in the DOM at every
    // value so the applied amount can be read back, and skipped only when there is nothing to tint.
    var veil = document.createElement('div');
    veil.id = 'default-bg-tint';
    veil.style.opacity = String(BrowserThemeState.normalizeTint(resolved.tint) / 100);
    document.body.appendChild(veil);
  }

  // ?date=YYYY-MM-DD lets the date-simulation harness pin the day this page renders.
  function pinnedDate() {
    var raw = new URLSearchParams(location.search).get('date');
    if (!raw) return undefined;
    var d = new Date(raw + 'T12:00:00');
    return isNaN(d.getTime()) ? undefined : d;
  }

  if (!window.BrowserThemeState || !BrowserThemeState.loadDefaultBackgroundConfig) return;

  BrowserThemeState.loadDefaultBackgroundConfig().then(function (cfg) {
    show(BrowserThemeState.resolveDailyBackground(cfg, pinnedDate()));
  });
})();
</script>
</body>
</html>
